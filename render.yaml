services:
  - type: web
    name: medicaljapan-2026
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true

    routes:
      - type: redirect
        source: "/brochures/Medical Japan 2026 - 전체 브로셔 합본.html"
        destination: "/brochures/Medical Japan 2026 - 참가기업 종합브로셔 (KR).html"
      - type: redirect
        source: "/brochures/Medical Japan 2026 - 전체 브로셔 합본 (KR).pdf"
        destination: "/brochures/Medical Japan 2026 - 참가기업 종합브로셔 (KR).html"
      - type: redirect
        source: "/brochures/Medical Japan 2026 - 出展企業総合ブロシュア (JP).pdf"
        destination: "/brochures/Medical Japan 2026 - 出展企業総合ブロシュア (JP).html"
      - type: redirect
        source: "/brochures/Medical Japan 2026 Company Brochure.html"
        destination: "/brochures/Medical Japan 2026 - Company Brochure (EN).html"
      - type: redirect
        source: "/buyer-guide-kr.pdf"
        destination: "/buyer-guide.html"
      - type: redirect
        source: "/buyer-guide-jp.pdf"
        destination: "/buyer-guide-jp.html"

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate

    # Static HTML site: Render automatically serves /404.html for missing pages
    # No rewrite rules needed
